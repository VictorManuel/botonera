name: Reportar un error
description: Informá un problema reproducible en Sonidera.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Gracias por ayudarnos a mejorar Sonidera. No adjuntes audios ni respaldos personales.
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué ocurrió?
      description: Describí el resultado observado y el esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir…
        2. Tocar…
        3. Ver…
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 140, Android 16
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: ¿La aplicación estaba instalada como PWA?
      options:
        - "No"
        - "Sí"
        - No estoy seguro/a
    validations:
      required: true
